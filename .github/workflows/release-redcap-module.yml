# Create a release for a new version of a REDCap External Module, when a pull request with a version
# number is merged into the main branch.

name: Release REDCap Module

on:
  workflow_call:
    inputs:
      NO_REPO_PKG:
        type: boolean
        default: false
        required: false
      USERS_NAMES:
        type: string
        required: false
      EXTERNAL_RELEASE_DB_URL:
        type: string
        required: false
      EXTERNAL_RELEASE_DB_DATA:
        type: string
        required: false
    secrets:
      SECRET1:
        required: false
      SECRET2:
        required: false


jobs:
  create_release:
    name: Create Release
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Get module version
        env:
          pullrequest_title: ${{ github.event.pull_request.title }}
        run: |
          if [ $pullrequest_title == "" ]; then
            exit 1
          else
            module_version=$(echo "$pullrequest_title" | egrep -o '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
            echo "module_version=$module_version" >> $GITHUB_ENV
          fi
          if [ $module_version == "" ]; then
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get module directory name
        run: |
          module_dirname=""
          if [ -f "./tests/init.json" ]; then
            initactions_total=$(jq '. | length' ./tests/init.json)
            initactions_current=0
            while [ "$initactions_current" != "$initactions_total" ]
            do
              initactions_current=$((initactions_current+1))
              initactions_action=$(jq -r '.[0].action' ./tests/init.json)
              if [ "$initactions_action" == "module" ]; then
                initactions_source=$(jq -r '.[0].source' ./tests/init.json)
                initactions_name=$(jq -r '.[0].name // ""' ./tests/init.json)
                if [ "$initactions_source" == "this" ] && [ "$initactions_name" != "" ]; then
                  module_dirname="$initactions_name"
                fi
              fi
              jq '.[1:]' ./tests/init.json > ./tests/init.json.tmp && mv ./tests/init.json.tmp ./tests/init.json
            done
          fi
          if [ "$module_dirname" == "" ] && [ -f "./tests/name.txt" ]; then
            module_dirname=$(head -n 1 ./tests/name.txt)
          fi
          if [ "$module_dirname" == "" ] && [ -f "./tests/dirname.txt" ]; then
            module_dirname=$(head -n 1 ./tests/dirname.txt)
          fi
          if [ "$module_dirname" == "" ]; then
            exit 1
          fi
          echo "module_dirname=$module_dirname" >> $GITHUB_ENV

      - name: Install any composer dependencies
        run: |
          if [ -f "composer.lock" ]; then
            composer install
          fi

      - name: Create release zip file
        run: |
          rm -r ./.[^.]*
          if [ -d "./tests" ]; then
            rm -r ./tests
          fi
          mkdir ~/files
          mkdir ~/files/main
          mkdir ~/files/main/${module_dirname}_v${module_version}
          cp -r ./. ~/files/main/${module_dirname}_v${module_version}/
          cd ~/files/main
          zip -r ../${module_dirname}_v${module_version}.zip *
          cd ~/files
          filesdir=$(pwd)
          echo "filesdir=$filesdir" >> $GITHUB_ENV

      - name: Create release
        env:
          releasebody: ${{ github.event.pull_request.body }}
        run: |
          echo "$releasebody" | jq -Rcs '{tag_name:"v${{ env.module_version }}",name:"v${{ env.module_version }}",body:.}' > ~/releasebody.json
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-Github-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "@$HOME/releasebody.json" > ~/releaseresponse.json
          upload_url=$(jq -r '.upload_url' ~/releaseresponse.json)
          echo "upload_url=$upload_url" >> $GITHUB_ENV

      - name: Upload zip
        run: |
          upload_url1=$(echo "$upload_url" | sed 's/{?name,label}/?name=${{ env.module_dirname }}_v${{ env.module_version }}.zip\&label=Download%20module/')
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-Github-Api-Version: 2022-11-28" \
            -H "Content-Type: application/zip" \
            $upload_url1 \
            --data-binary "@$filesdir/${module_dirname}_v${module_version}.zip"

      - name: Submit release details to an external release database
        if: inputs.EXTERNAL_RELEASE_DB_URL != '' && inputs.EXTERNAL_RELEASE_DB_DATA != ''
        env:
          releasebody: ${{ github.event.pull_request.body }}
          pr_assignee: ${{ github.event.pull_request.assignee.login }}
          pr_number: ${{ github.event.pull_request.number }}
          users_names: ${{ inputs.USERS_NAMES }}
          external_release_db_url: ${{ inputs.EXTERNAL_RELEASE_DB_URL }}
          external_release_db_data: ${{ inputs.EXTERNAL_RELEASE_DB_DATA }}
          secret1: ${{ secrets.SECRET1 }}
          secret2: ${{ secrets.SECRET2 }}
        run: |
          releasebody=$(jq -n --arg releasebody "$releasebody" '$releasebody')
          users_names='{'"$users_names"'}'
          approvals=$(curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-Github-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pulls/$pr_number/reviews )
          if [ ${approvals:0:1} != "[" ]; then
            approvals="[]"
          fi
          approvals=$(echo "$approvals" | jq --argjson names "$users_names" \
            '.[] | select(.state == "APPROVED") | { name: ($names[.user.login] // .user.login), date: .submitted_at }' | jq -s -c '.')
          user_name=$((echo "$users_names" | jq -r '."'"$pr_assignee"'" // "'"$pr_assignee"'"' 2>/dev/null) || echo "$pr_assignee")
          user_name=$(echo "$user_name" | jq -R '.')
          module_version=$(echo "$module_version" | jq -R '.')
          external_release_db_url=$(echo "$external_release_db_url" | jq -r -R '.|split("[secret-1]")|join("'"$secret1"'")|split("[secret-2]")|join("'"$secret2"'")')
          echo "$external_release_db_data" | jq -r -R --arg version "$module_version" --arg approvals "$approvals" --arg username "$user_name" --arg releasebody "$releasebody" '.|split("[secret-1]")|join("'"$secret1"'")|split("[secret-2]")|join("'"$secret2"'")|split("[release-body]")|join($releasebody)|split("[unit-version]")|join($version)|split("[user-name]")|join($username)|split("[unit-approvals]")|join($approvals)' > ~/external_release_db_data
          curl -L -X POST \
            -H "Content-Type: application/json" \
            $external_release_db_url \
            --data-binary "@$HOME/external_release_db_data"
